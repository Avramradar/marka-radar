name: Check MarkaRadar

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: "123456789:TEST_TOKEN"
      DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/markaradar"
      ADMIN_ID: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall bot.py app alembic

      - name: Check SQLAlchemy models
        run: |
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers

          import app.database.models

          configure_mappers()

          print("Все модели SQLAlchemy успешно проверены")
          PY

      - name: Check Alembic configuration
        run: |
          alembic history
          alembic heads
