name: Check MarkaRadar

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markaradar
          POSTGRES_PASSWORD: markaradar_test
          POSTGRES_DB: markaradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U markaradar -d markaradar_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BOT_TOKEN: "123456789:TEST_TOKEN"
      DATABASE_URL: "postgresql+asyncpg://markaradar:markaradar_test@localhost:5432/markaradar_test"
      ADMIN_ID: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall bot.py app alembic

      - name: Check SQLAlchemy models
        run: |
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers

          import app.database.models

          configure_mappers()

          print("Все модели SQLAlchemy успешно проверены")
          PY

      - name: Show Alembic migration history
        run: |
          alembic history
          alembic heads

      - name: Apply database migrations
        run: |
          alembic upgrade head

      - name: Check current database revision
        run: |
          alembic current

      - name: Test migration rollback
        run: |
          alembic downgrade base

      - name: Apply migrations again
        run: |
          alembic upgrade head

      - name: Verify created tables
        run: |
          python - <<'PY'
          import asyncio

          from sqlalchemy import inspect
          from app.database.session import engine


          async def check_tables() -> None:
              async with engine.connect() as connection:
                  tables = await connection.run_sync(
                      lambda sync_connection: inspect(
                          sync_connection
                      ).get_table_names()
                  )

              required_tables = {
                  "alembic_version",
                  "users",
                  "brands",
                  "categories",
                  "products",
                  "ratings",
                  "reviews",
                  "price_observations",
                  "product_aliases",
                  "product_relations",
                  "search_history",
              }

              missing_tables = required_tables - set(tables)

              if missing_tables:
                  raise RuntimeError(
                      "Не созданы таблицы: "
                      + ", ".join(sorted(missing_tables))
                  )

              print("Созданные таблицы:")
              for table in sorted(tables):
                  print(f"- {table}")

              await engine.dispose()


          asyncio.run(check_tables())
          PY
