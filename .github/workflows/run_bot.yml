name: Run MarkaRadar Bot

on:
  workflow_dispatch:

concurrency:
  group: markaradar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$ADMIN_ID" ]; then
            echo "ADMIN_ID secret is missing"
            exit 1
          fi

      - name: Apply database migrations
        run: |
          alembic upgrade head

      - name: Scan product duplicates
        run: |
          python scan_product_duplicates.py

      - name: Verify duplicate candidates
        run: |
          python verify_duplicate_candidates.py

      - name: Start MarkaRadar
        run: |
          python bot.py
