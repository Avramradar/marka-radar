name: Test Open Food Facts

on:
  workflow_dispatch:

jobs:
  test-open-food-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download 100 products
        run: |
          python - <<'PY'
          import asyncio

          from app.importers.open_food_facts_client import (
              OpenFoodFactsClient,
          )


          async def main() -> None:
              client = OpenFoodFactsClient()

              products = await client.search_products(
                  page=1,
                  page_size=100,
                  country="russia",
              )

              print(
                  f"Получено товаров: {len(products)}"
              )

              valid_products = 0

              for number, product in enumerate(
                  products,
                  start=1,
              ):
                  barcode = str(
                      product.get("code") or ""
                  ).strip()

                  name = (
                      product.get("product_name_ru")
                      or product.get("product_name")
                      or product.get("generic_name")
                      or "Без названия"
                  )

                  brand = (
                      product.get("brands")
                      or "Бренд не указан"
                  )

                  image_url = (
                      product.get("image_front_url")
                      or product.get("image_url")
                      or ""
                  )

                  if barcode and name != "Без названия":
                      valid_products += 1

                  print(
                      "\n"
                      f"{number}. {name}\n"
                      f"   Бренд: {brand}\n"
                      f"   Штрихкод: {barcode or 'нет'}\n"
                      f"   Фото: {'есть' if image_url else 'нет'}"
                  )

              print(
                  "\n"
                  f"Пригодных для импорта товаров: "
                  f"{valid_products}"
              )

              if not products:
                  raise RuntimeError(
                      "Open Food Facts не вернул товары"
                  )

              if valid_products == 0:
                  raise RuntimeError(
                      "Не найдено товаров со штрихкодом "
                      "и названием"
                  )


          asyncio.run(main())
          PY
